0" text-anchor="middle"><tspan x="530" y="342.78">Persisted</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="255" y="381.78">201 Created (queued)</tspan></text><text fill="#2D7D70" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="63" y="439.94">WHEN THE REMINDER IS DUE</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="466.78">Atomically claim due job</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="503.78">Job + booking snapshot</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1060" y="543.78">GET check-in forecast</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1060" y="582.78">Forecast / unavailable</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="622.78">Recheck status + revision</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="659.78">Active + current revision</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1195" y="703.78">Send reminder with forecast or fallback</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1195" y="742.78">SMTP accepted</tspan></text><text fill="#173B34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="786.78">Save sent status</tspan></text><text fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="800" y="874.78">The reminder is normally due at 09:00 the day before check-in. A late booking can make it due immediately.</tspan></text></svg>